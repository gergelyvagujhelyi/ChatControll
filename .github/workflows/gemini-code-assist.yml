name: Gemini Code Assist

on:
  pull_request:
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Code Assist
        uses: google/gemini-code-assist-action@v1
