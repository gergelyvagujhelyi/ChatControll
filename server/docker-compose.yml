services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatcontroll
      POSTGRES_USER: chatcontroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatcontroll"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    environment:
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET in .env}
    command: >
      turnserver
      --no-cli
      --no-tls
      --no-dtls
      --realm=chatcontroll
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --listening-port=3478
      --min-port=49152
      --max-port=65535
      --external-ip=${TURN_RELAY_IP:?Set TURN_RELAY_IP in .env}
      --log-file=stdout
      --simple-log

  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://chatcontroll:${POSTGRES_PASSWORD}@db/chatcontroll
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      TURN_RELAY_IP: ${TURN_RELAY_IP:-}
      TURN_SECRET: ${TURN_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MAX_MESSAGES_PER_MINUTE: ${MAX_MESSAGES_PER_MINUTE:-60}
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH in .env}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH in .env}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - server

volumes:
  pgdata:
